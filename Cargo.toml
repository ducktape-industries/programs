# programs — the ducktape contract line and the programs written against it,
# one repository.
#
#   crates/sdk/     the contracts: `error` (the one `Error` and its codes, below both SDKs),
#                   `program` (the program SDK: the one `Program` trait a
#                   program implements and a view names it by, `ExecCtx`/
#                   `QueryCtx`, `export!`, refusals; `MockHost` runs a program
#                   natively), `store` (optional typed tables and paging over
#                   program's contexts), `ducklink` (the `duck://`
#                   grammar), the view contract (`view-wire`,
#                   `view`, `design`, `policy-view`, `markdown`), and `conformance` (the
#                   role suite a program proves it fills a role with)
#   crates/system/  the boot set: programs, valset, identity and blobs, one
#                   crate each in the same shape as the app programs; the
#                   suite under programs/tests founds ducktape's host
#                   over the bytes `make wasm-programs` built
#   crates/app/     the app programs: chat and forge (each one crate: types and
#                   rules always, the wasm exports behind the `program`
#                   feature), chat-view and forge-view (which link their
#                   program crate with the feature off) and the system views
#   crates/lib/     libraries a program links: gitcore (git objects, packs,
#                   walks, diffs, the wire's server side), borsh-json (a
#                   program's values as JSON by the borsh schema it carries),
#                   model-wire (the harness wire and its provider adapters)
#
# A view links its program by path and reads its types; a view is a cdylib for
# wasm32-unknown-unknown on `view`. The host that runs the programs
# (runtime, state, blob, host, node, consensus, the daemon) lives in ducktape,
# and so does the kernel ABI every program speaks: `abi` below is ducktape's
# own `crates/kernel/abi` at the rev the host is pinned to, so the host and
# every program share one abi. `program` is the full program SDK, not the
# kernel's small `program` crate.

[workspace]
resolver = "2"
members = [
    "crates/sdk/error",
    "crates/sdk/program",
    "crates/sdk/program-derive",
    "crates/sdk/store",
    "crates/sdk/ducklink",
    "crates/sdk/design",
    "crates/sdk/describe",
    "crates/sdk/conformance",
    "crates/sdk/view-wire",
    "crates/sdk/view",
    "crates/sdk/view-derive",
    "crates/sdk/policy-view",
    "crates/sdk/markdown",
    "crates/sdk/founding",
    "crates/system/programs",
    "crates/system/valset",
    "crates/system/identity",
    "crates/system/blobs",
    "crates/system/awaits",
    "crates/system/halo",
    "crates/system/access",
    "crates/system/ownership",
    "crates/system/scheduler",
    "crates/app/chat",
    "crates/app/chat-view",
    "crates/app/forge-view",
    "crates/app/members-view",
    "crates/app/node-view",
    "crates/app/explorer-view",
    "crates/app/settings-view",
    "crates/app/example-view",
    "crates/app/forge",
    "crates/app/activity",
    "crates/app/files",
    "crates/app/files-view",
    "crates/app/egress",
    "crates/app/attribution",
    "crates/app/harness",
    "crates/app/harness-view",
    "crates/app/actions",
    "crates/app/actions-pods",
    "crates/app/fleet",
    "crates/app/forge-review-chat",
    "crates/app/wake",
    "crates/lib/gitcore",
    "crates/lib/borsh-json",
    "crates/lib/model-wire",
]
# Third-party crates taken whole (crates/vendor/<crate>/README.ducktape.md
# says from where and what differs). Path dependencies, not members: the
# workspace's lints and gates are not theirs.
exclude = ["crates/vendor"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
# ---- the contracts, in tree
error = { path = "crates/sdk/error" }
program = { path = "crates/sdk/program" }
store = { path = "crates/sdk/store" }
gitcore = { path = "crates/lib/gitcore" }
borsh-json = { path = "crates/lib/borsh-json" }
model-wire = { path = "crates/lib/model-wire" }
ducklink = { path = "crates/sdk/ducklink" }
design = { path = "crates/sdk/design" }
view-wire = { path = "crates/sdk/view-wire" }
describe = { path = "crates/sdk/describe" }
conformance = { path = "crates/sdk/conformance" }
view = { path = "crates/sdk/view" }
policy-view = { path = "crates/sdk/policy-view" }
markdown = { path = "crates/sdk/markdown" }
gpui = { package = "gpui-pre", git = "https://github.com/ducktape-industries/gpui-pre", rev = "eef11e96c9fcf7e0389d31f125013370a1b02d92", default-features = false }
programs = { path = "crates/system/programs" }
valset = { path = "crates/system/valset" }
identity = { path = "crates/system/identity" }
blobs = { path = "crates/system/blobs" }
awaits = { path = "crates/system/awaits" }
halo = { path = "crates/system/halo" }
access = { path = "crates/system/access" }
ownership = { path = "crates/system/ownership" }
scheduler = { path = "crates/system/scheduler" }
chat = { path = "crates/app/chat" }
forge = { path = "crates/app/forge" }
actions-pods = { path = "crates/app/actions-pods" }
actions = { path = "crates/app/actions" }
fleet = { path = "crates/app/fleet" }
forge-review-chat = { path = "crates/app/forge-review-chat" }
wake = { path = "crates/app/wake" }
attribution = { path = "crates/app/attribution" }
harness = { path = "crates/app/harness" }
egress = { path = "crates/app/egress" }
activity = { path = "crates/app/activity" }
files = { path = "crates/app/files" }

# ---- the kernel ABI a program and the host share: ducktape's own
# `crates/kernel/abi`, at the rev the host below is pinned to
abi = { git = "https://github.com/ducktape-industries/ducktape", rev = "6ead346a0958905110ecce2f9f80f5ceaad7ea43" }

# ---- the blobs contract the blobs program records and the programs that read
# held blobs ask it by; the host the founding suite runs the boot set on and
# the key schemes it signs with, and the probe fixture it seats
# (dev-dependencies only)
host = { git = "https://github.com/ducktape-industries/ducktape", rev = "6ead346a0958905110ecce2f9f80f5ceaad7ea43" }
blob = { git = "https://github.com/ducktape-industries/ducktape", rev = "6ead346a0958905110ecce2f9f80f5ceaad7ea43" }
keyscheme = { git = "https://github.com/ducktape-industries/ducktape", rev = "6ead346a0958905110ecce2f9f80f5ceaad7ea43" }
fixture-wasm = { git = "https://github.com/ducktape-industries/ducktape", rev = "6ead346a0958905110ecce2f9f80f5ceaad7ea43" }
commonware-cryptography = "2026.9.0"
commonware-runtime = "2026.9.0"

# ---- external
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# borsh — the one codec the program abi is written in, with the schemas that describe a
# program's ops, queries and replies to a reader that has no Rust type for them.
borsh = { version = "1", default-features = false, features = ["derive", "std", "unstable__schema"] }
sha1-checked = { version = "0.10", default-features = false }
sha2 = "0.10"
tempfile = "3"
base64 = "0.22"
futures = "0.3"
# The markdown crate's parser (its `parse` feature): CommonMark + GFM, no HTML
# writer and no CLI.
pulldown-cmark = { version = "0.13", default-features = false }
# duckfs path normalization: NFC so visually-identical names collide instead
# of coexisting (a consensus-determinism requirement, not cosmetics).
unicode-normalization = "0.1"
# harness's agent configuration: the TOML front matter of a file in files.
toml = { version = "1", default-features = false, features = ["std", "parse", "display", "serde"] }

[patch."https://github.com/ducktape-industries/ducktape"]
store = { path = "crates/sdk/store" }

# proc-macro and build-script crates (serde_derive, async-trait, borsh-derive)
# are compiled once and then run for every unit below them — unoptimized they
# dominate a debug build.
[profile.dev.build-override]
opt-level = 2

[profile.dev.package.design]
opt-level = 2

# a view and a program ship as cdylibs for wasm32-unknown-unknown; the release
# profile is what their bytes come out of.
[profile.release]
# Wire serde visitors dominate views; optimize their shared code for size.
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# A view's redraw is fuel per instruction, and a view redraws on every
# event: the views and the SDK crates only they link are built for speed.
# One a notifier links goes in `[profile.notify]` too, back at size.
[profile.release.package.chat-view]
opt-level = 3
[profile.release.package.forge-view]
opt-level = 3
[profile.release.package.members-view]
opt-level = 3
[profile.release.package.node-view]
opt-level = 3
[profile.release.package.explorer-view]
opt-level = 3
[profile.release.package.settings-view]
opt-level = 3
[profile.release.package.policy-view]
opt-level = 3
[profile.release.package.markdown]
opt-level = 3
[profile.release.package.files-view]
opt-level = 3
[profile.release.package.view]
opt-level = 3
[profile.release.package.view-wire]
opt-level = 3
[profile.release.package.forge]
opt-level = 3
[profile.release.package.gitcore]
opt-level = 3
[profile.release.package.gpui-pre]
opt-level = 3

# `WASM_PROFILE=fast` (`make dev`, a view's `--example live`): the release
# profile without what makes a release slow to build, one fat-LTO link of
# one codegen unit per artifact; wasm-opt skips its bytes too
# (`tools/view-gate.sh`). The opt-levels above stay, so a view's fuel stays
# close to what ships. Its own output dir; nothing ships from it: a release,
# a founding and a network's code are the release profile's.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16

# `make wasm-notifiers`: a notifier runs on an event, not per frame, and
# stays resident for every program on every network, so its bytes count
# and its fuel far less: the release profile, with the crates above that a
# notifier links back at size. Its own output dir.
[profile.notify]
inherits = "release"
[profile.notify.package.chat-view]
opt-level = "z"
[profile.notify.package.forge-view]
opt-level = "z"
[profile.notify.package.view]
opt-level = "z"
[profile.notify.package.view-wire]
opt-level = "z"
[profile.notify.package.forge]
opt-level = "z"
[profile.notify.package.gitcore]
opt-level = "z"
[profile.notify.package.gpui-pre]
opt-level = "z"

# `make wasm-why`: the release bytes with their names, so twiggy can say
# whose they are. Its own output dir; nothing ships from it.
[profile.why]
inherits = "release"
strip = "debuginfo"

[patch.crates-io]
gpui-pre-scheduler = { git = "https://github.com/ducktape-industries/gpui-pre", rev = "eef11e96c9fcf7e0389d31f125013370a1b02d92" }
