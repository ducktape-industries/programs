[package]
name = "identity"
version.workspace = true
edition.workspace = true

# The types and the rules over `store` are always built; a view links them
# with `program` off. `program` adds its wasm exports (`program::export!`), which
# only its own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = []
# `describe` makes this crate\'s wasm build the `ducktape.describe` module:
# the `describe` export alone, no program, no imports.
describe = []

[dependencies]
abi = { workspace = true }
design = { path = "../../sdk/design" }
describe = { path = "../../sdk/describe" }
borsh = { workspace = true }
program = { path = "../../sdk/program" }
store = { path = "../../sdk/store" }
