[package]
name = "programs"
version.workspace = true
edition.workspace = true

# The contract types, the rules over `store` and the origin helpers every
# system program shares are always built; a view links them with `program`
# off. `program` adds its wasm exports
# (`program::export!`), which only its own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = []
# `describe` makes this crate\'s wasm build the `ducktape.describe` module:
# the `describe` export alone, no program, no imports.
describe = []

[dependencies]
abi = { workspace = true }
blob = { workspace = true }
describe = { path = "../../sdk/describe" }
borsh = { workspace = true }
program = { path = "../../sdk/program" }
store = { path = "../../sdk/store" }

# The founding suite (`tests/system.rs`) drives the built boot set on the host.
[dev-dependencies]
design = { path = "../../sdk/design" }
access = { path = "../access" }
ownership = { path = "../ownership" }
activity = { path = "../../app/activity" }
awaits = { path = "../awaits" }
halo = { path = "../halo" }
scheduler = { path = "../scheduler" }
chat = { path = "../../app/chat" }
files = { path = "../../app/files" }
attribution = { path = "../../app/attribution" }
harness = { path = "../../app/harness" }
egress = { path = "../../app/egress" }
crosspond = { path = "../crosspond" }
node = { workspace = true }
forge = { path = "../../app/forge" }
gitcore = { path = "../../lib/gitcore" }
identity = { path = "../identity" }
valset = { path = "../valset" }
commonware-cryptography = { workspace = true, features = ["std"] }
commonware-runtime = { workspace = true }
host = { workspace = true }
fixture-wasm = { workspace = true }
blobs = { path = "../blobs" }
keyscheme = { workspace = true, features = ["testkit"] }
# the drift test reads `cargo metadata`
serde_json = { workspace = true }
tempfile = { workspace = true }
