[package]
name = "halo"
version.workspace = true
edition.workspace = true

# The types and the rules over `store` are always built; `program` adds the
# wasm exports, which only its own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = []
# `describe` makes this crate's wasm build the `ducktape.describe` module:
# the `describe` export alone, no program, no imports.
describe = []

[dependencies]
abi = { workspace = true }
describe = { path = "../../sdk/describe" }
program = { path = "../../sdk/program" }
store = { path = "../../sdk/store" }

[dev-dependencies]
valset = { path = "../valset" }
