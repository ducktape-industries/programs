# the `duck://` link: one grammar for naming a thing on a ducktape network,
# read in one place. Names no program: the first segment is a program the
# roster knows, and what follows it is that program's to read. It depends on
# `abi`, for the refusal words, and `program`, for the one spelling of a
# program id.
[package]
name = "ducklink"
edition.workspace = true
version.workspace = true

[dependencies]
abi = { workspace = true }
program = { path = "../program" }
