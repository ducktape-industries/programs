[package]
name = "store"
version.workspace = true
edition.workspace = true

# The optional typed layer over `program`: the `Map`/`Set`/`Item` descriptors
# with `KeyCodec`, and `Page`/`PageReply`. Their methods take `program`'s
# contexts. A view links it (and `program`) and calls none of them.
[dependencies]
abi = { workspace = true }
borsh = { workspace = true }
program = { path = "../program" }
serde = { workspace = true }
