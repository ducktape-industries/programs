network = "NETWORK"           # the network's name; every frame and invite on it carries it
time = 0                      # the genesis block's time, unix milliseconds: `date +%s000`
epoch_length = 64
block_time_ms = 1000
hooks = ["activity"]

[[validators]]
key = "KEY"                   # this node's key: `ducktape identity`
address = "ADDRESS"           # where peers dial it: tcp://, tls://, ws:// or wss://; drop the line if none can
halo = "HALO"                 # host:port other members dial it at over QUIC; the same as `ducktape init --halo`

[[programs]]
id = "programs"
code = "programs.wasm"
roles = ["programs"]

[[programs]]
id = "valset"
code = "valset.wasm"
roles = ["validators"]

