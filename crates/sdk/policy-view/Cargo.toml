[package]
name = "policy-view"
edition.workspace = true
version.workspace = true
publish = false

# What every view shows of the ownership program's policies: the kinds of
# item a default names, a policy in words, and one owner's side read whole.
# It links the program crates with `program` off, as every view does.
[dependencies]
identity = { path = "../../system/identity" }
ownership = { path = "../../system/ownership" }
# `link`: access's own list, set beside a policy while programs' Roles still binds access
abi.workspace = true
access = { path = "../../system/access" }
program = { path = "../program" }
programs = { path = "../../system/programs" }
serde.workspace = true
view = { path = "../view" }

# The test that holds `KINDS` to the kinds each program's owned tables claim.
[dev-dependencies]
chat = { path = "../../app/chat" }
forge = { path = "../../app/forge" }
harness = { path = "../../app/harness" }
egress = { path = "../../app/egress" }
files = { path = "../../app/files" }
