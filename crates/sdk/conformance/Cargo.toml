[package]
name = "conformance"
version.workspace = true
edition.workspace = true

# The role conformance suite: drives a program's native `program::Program` over
# `MockHost` with the role's own bytes. Native only (MockHost is), so a
# program takes it as a dev-dependency.
[dependencies]
abi = { workspace = true }
borsh = { workspace = true }
program = { path = "../program" }

# The suite proven on the reference programs (tests/).
[dev-dependencies]
awaits = { path = "../../system/awaits" }
blob = { workspace = true }
blobs = { path = "../../system/blobs" }
halo = { path = "../../system/halo" }
identity = { path = "../../system/identity" }
valset = { path = "../../system/valset" }
programs = { path = "../../system/programs" }
scheduler = { path = "../../system/scheduler" }
