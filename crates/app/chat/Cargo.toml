[package]
name = "chat"
version.workspace = true
edition.workspace = true

# The types and rules are always built; the view links them with `program`
# off. `program` adds its wasm exports
# (`program::export!`), which only its own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = []
# `describe` makes this crate's wasm build the `ducktape.describe` module:
# the `describe` export alone, no program, no imports.
describe = []

[dependencies]
ownership = { path = "../../system/ownership" }
abi = { workspace = true }
design = { path = "../../sdk/design" }
# where a bare link typed in prose ends (`ducklink::bare_end`)
ducklink = { path = "../../sdk/ducklink" }
attribution = { path = "../attribution" }
describe = { path = "../../sdk/describe" }
borsh = { workspace = true }
program = { path = "../../sdk/program", features = ["serde"] }
# `#[derive(program::Ask)]` on `Query`
serde = { workspace = true }
store = { path = "../../sdk/store" }
unicode-normalization = { workspace = true }

[dev-dependencies]
access = { path = "../../system/access" }
awaits = { path = "../../system/awaits" }
crosspond = { path = "../../system/crosspond", features = ["program"] }
scheduler = { path = "../../system/scheduler" }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
store = { path = "../../sdk/store" }
