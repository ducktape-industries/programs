[package]
name = "chat"
version.workspace = true
edition.workspace = true

# The types and rules are always built; the view links them with `program`
# off. `program` adds its wasm exports
# (`program::export!`), which only its own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = []
# `describe` makes this crate's wasm build the `ducktape.describe` module:
# the `describe` export alone, no program, no imports.
describe = []

[dependencies]
ownership = { workspace = true }
abi = { workspace = true }
design = { workspace = true }
# where a bare link typed in prose ends (`ducklink::bare_end`)
ducklink = { workspace = true }
attribution = { workspace = true }
describe = { workspace = true }
borsh = { workspace = true }
program = { workspace = true, features = ["serde"] }
# `#[derive(program::Ask)]` on `Query`
serde = { workspace = true }
store = { workspace = true }
unicode-normalization = { workspace = true }

[dev-dependencies]
access = { workspace = true }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
store = { workspace = true }
