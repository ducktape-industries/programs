[package]
name = "files-view"
edition.workspace = true
version.workspace = true
publish = false

# A Rust-authored view, exported as a dynamically loaded wasm module by
# `export_view!`; `unsafe_code` is not forbidden only because the module
# exports need `#[unsafe(export_name)]`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
abi.workspace = true
access = { path = "../../system/access" }
view = { path = "../../sdk/view" }
serde.workspace = true
# the program this view draws: its ops, its asks and its path rule
files = { path = "../files" }
programs = { path = "../../system/programs" }
# who writes a path: its guard's policy, read and set as every view does
ownership = { path = "../../system/ownership" }
policy-view = { path = "../../sdk/policy-view" }
# the reader's name, which names their home, and every author's
identity = { path = "../../system/identity" }
# a row's `duck://` link
ducklink = { path = "../../sdk/ducklink" }
# a `.md` file read, drawn and its links followed as forge-view does a repository's
markdown = { path = "../../sdk/markdown", features = ["parse"] }

[dev-dependencies]
# `examples/live.rs` and the tests: the real `files` program on the fake node
view = { path = "../../sdk/view", features = ["rig"] }
# a screen's frame written for the app's node-less renderer
serde_json.workspace = true

[package.metadata.ducktape]
ships = true
rides = "files"
