[package]
name = "files-view"
edition.workspace = true
version.workspace = true
publish = false

# A Rust-authored view, exported as a dynamically loaded wasm module by
# `export_view!`; `unsafe_code` is not forbidden only because the module
# exports need `#[unsafe(export_name)]`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
abi.workspace = true
access = { workspace = true }
view.workspace = true
serde.workspace = true
# the program this view draws: its ops, its asks and its path rule
files.workspace = true
# the reader's name, which names their home, and every author's
identity.workspace = true
# a row's `duck://` link
ducklink.workspace = true
# a `.md` file read, drawn and its links followed as forge-view does a repository's
markdown = { workspace = true, features = ["parse"] }

[dev-dependencies]
# `examples/live.rs` and the tests: the real `files` program on the fake node
view = { workspace = true, features = ["rig"] }
# a screen's frame written for the app's node-less renderer
serde_json.workspace = true
