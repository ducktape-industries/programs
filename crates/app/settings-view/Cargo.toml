[package]
name = "settings-view"
edition.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
abi.workspace = true
view.workspace = true
access.workspace = true
ownership.workspace = true
policy-view.workspace = true
harness.workspace = true
identity.workspace = true
valset.workspace = true
serde.workspace = true
# the picked picture decoded, cut and saved as the avatar's JPEG: the one
# gpui-pre already links into every view
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

[dev-dependencies]
# `examples/live.rs`: the view in the real app over the fake node
view = { workspace = true, features = ["rig"] }
# the screen export writes the fixtures as JSON
serde_json.workspace = true
