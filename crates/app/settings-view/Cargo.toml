[package]
name = "settings-view"
edition.workspace = true
version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
abi.workspace = true
view = { path = "../../sdk/view" }
ownership = { path = "../../system/ownership" }
policy-view = { path = "../../sdk/policy-view" }
identity = { path = "../../system/identity" }
valset = { path = "../../system/valset" }
serde.workspace = true
# the picked picture decoded, cut and saved as the avatar's JPEG: the one
# gpui-pre already links into every view
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }

[dev-dependencies]
# `examples/live.rs`: the view in the real app over the fake node
view = { path = "../../sdk/view", features = ["rig"] }
# the screen export writes the fixtures as JSON
serde_json.workspace = true

[package.metadata.ducktape]
ships = true
rides = "programs"
