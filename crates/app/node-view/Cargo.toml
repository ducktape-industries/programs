[package]
name = "node-view"
edition.workspace = true
version.workspace = true
publish = false

# A Rust-authored view, exported as a dynamically loaded wasm module by
# `export_view!`; `unsafe_code` is not forbidden only because the module
# exports need `#[unsafe(export_name)]`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `abi::hex` is how a key reaches the screen.
abi.workspace = true
view = { path = "../../sdk/view" }
# who operates a node (an agent's manager) and the roster a change names
identity = { path = "../../system/identity" }
programs = { path = "../../system/programs" }
valset = { path = "../../system/valset" }
serde.workspace = true

[dev-dependencies]
# `examples/live.rs`: the view in the real app over the fake node
view = { path = "../../sdk/view", features = ["rig"] }
serde_json.workspace = true

[package.metadata.ducktape]
ships = true
rides = "valset"
