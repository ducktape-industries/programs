[package]
name = "forge"
edition.workspace = true
version.workspace = true

# The types and rules are always built and run natively over `program::MockHost`;
# `forge-view` links them with `program` off. `program` adds its wasm exports
# (`program::export!`), which only its own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = []
# `describe` makes this crate's wasm build the `ducktape.describe` module:
# the `describe` export alone, no program, no imports.
describe = []

[dependencies]
ownership = { path = "../../system/ownership" }
abi = { workspace = true }
describe = { path = "../../sdk/describe" }
program = { path = "../../sdk/program", features = ["serde"] }
borsh = { workspace = true }
chat = { path = "../chat" }
ducklink = { path = "../../sdk/ducklink" }
gitcore = { path = "../../lib/gitcore" }
# `#[derive(program::Ask)]` on `Query`: which tables each question reads
store = { path = "../../sdk/store" }

[dev-dependencies]
criterion = "=0.8.2"
access = { path = "../../system/access" }
scheduler = { path = "../../system/scheduler" }
sha2 = { version = "0.10", default-features = false }

[[bench]]
name = "tree"
harness = false
