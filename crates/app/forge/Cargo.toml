[package]
name = "forge"
edition.workspace = true
version.workspace = true

# The types and rules are always built and run natively over `program::MockHost`;
# `forge-view` links them with `program` off. `program` adds its wasm exports
# (`program::export!`), which only its own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = []
# `describe` makes this crate's wasm build the `ducktape.describe` module:
# the `describe` export alone, no program, no imports.
describe = []

[dependencies]
abi = { workspace = true }
describe = { workspace = true }
program = { workspace = true, features = ["serde"] }
borsh = { workspace = true }
chat = { workspace = true }
gitcore = { workspace = true }
# `#[derive(program::Ask)]` on `Query`: which tables each question reads
store = { workspace = true }

[dev-dependencies]
access = { workspace = true }
sha2 = { version = "0.10", default-features = false }
