[package]
name = "harness-view"
edition.workspace = true
version.workspace = true
publish = false

# A Rust-authored view, exported as a dynamically loaded wasm module by
# `export_view!`; `unsafe_code` is not forbidden only because the module
# exports need `#[unsafe(export_name)]`.
[lib]
crate-type = ["cdylib"]

[dependencies]
view = { path = "../../sdk/view" }
# The programs with `program` off: their types and the programs this view
# names them by, no host import.
harness = { path = "../harness" }
identity = { path = "../../system/identity" }
egress = { path = "../egress" }
# an agent's configuration is a file in files: the form commits it
files = { path = "../files" }
access = { path = "../../system/access" }
# who can start an agent's conversations and edit a model: ownership's answers, in policy-view's
# words
ownership = { path = "../../system/ownership" }
policy-view = { path = "../../sdk/policy-view" }
program = { path = "../../sdk/program" }
# `dm_peers`: a DM's place reads as the person it is with
chat = { path = "../chat" }
# mints the `duck://<chain>/<program>/<place>` link "Open in chat" opens
ducklink = { path = "../../sdk/ducklink" }
serde.workspace = true
# a tool call's input is JSON: the file a files_write names
serde_json.workspace = true

[dev-dependencies]
# what a test answers for the roster's roles and ownership's new policy id
abi.workspace = true
programs = { path = "../../system/programs" }

[package.metadata.ducktape]
ships = true
rides = "harness"
