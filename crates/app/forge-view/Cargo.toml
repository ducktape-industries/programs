[package]
name = "forge-view"
edition.workspace = true
version.workspace = true
publish = false

# A Rust-authored view, exported as a dynamically loaded wasm module by
# `export_view!`. It links `forge` for its wire and `chat` for the
# conversation wire, both with their `program` feature off: the types and
# rules, no host import and no program export.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Builds forge's notifier alone (`notifier.rs`, `export_notifier!`) in place
# of the view: what a founding packs as the program's `ducktape.notify`
# section. Never on in the view's build.
notifier = []

[dependencies]
view = { path = "../../sdk/view" }
abi.workspace = true
access = { path = "../../system/access" }
borsh.workspace = true
chat = { path = "../chat" }
ducklink = { path = "../../sdk/ducklink" }
forge = { path = "../forge" }
identity = { path = "../../system/identity" }
# a chat block's keys read back (`notifier.rs`): which thread a reply answered
store = { path = "../../sdk/store" }
# who can edit a repository or a change: ownership's answers, in policy-view's words
ownership = { path = "../../system/ownership" }
policy-view = { path = "../../sdk/policy-view" }
# documents read, highlighted and drawn: the SDK's, with its parser
markdown = { path = "../../sdk/markdown", features = ["parse"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# `examples/live.rs`: the view in the real app over the fake node
view = { path = "../../sdk/view", features = ["rig"] }
# the example's seeded history, under the bounds a founding gives forge
gitcore = { path = "../../lib/gitcore" }
founding = { path = "../../sdk/founding" }
program = { path = "../../sdk/program" }
# the roster's roles a test answers: whether access still gates
programs = { path = "../../system/programs" }

[package.metadata.ducktape]
ships = true
rides = "forge"
