[package]
name = "chat-view"
edition.workspace = true
version.workspace = true
publish = false

# A Rust-authored view, exported as a dynamically loaded wasm module by
# `export_view!`; `unsafe_code` is not forbidden only because the module
# exports need `#[unsafe(export_name)]`.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Builds chat's notifier alone (`notifier.rs`, `export_notifier!`) in place
# of the view: what a founding packs as the program's `ducktape.notify`
# section. Never on in the view's build.
notifier = []

[dependencies]
view = { path = "../../sdk/view" }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
ducklink = { path = "../../sdk/ducklink" }
chat = { path = "../chat" }
files = { path = "../files" }
unicode-normalization.workspace = true
identity = { path = "../../system/identity" }
access = { path = "../../system/access" }
harness = { path = "../harness" }
program = { path = "../../sdk/program" }
abi.workspace = true
# who can edit a room or a message: ownership's answers, in policy-view's words
ownership = { path = "../../system/ownership" }
policy-view = { path = "../../sdk/policy-view" }
# code blocks, tables and headings drawn as forge-view draws them, with no parser
markdown = { path = "../../sdk/markdown" }
# widgets: a widget file's TOML, and any program's query and reply as JSON
# by the schema its code carries
toml.workspace = true
borsh.workspace = true
borsh-json = { path = "../../lib/borsh-json" }
programs = { path = "../../system/programs" }

[dev-dependencies]
criterion = "=0.8.2"
# `examples/live.rs` and the chain-backed tests: the fake node
view = { path = "../../sdk/view", features = ["rig"] }

[[bench]]
name = "timeline"
harness = false

[package.metadata.ducktape]
ships = true
rides = "chat"
