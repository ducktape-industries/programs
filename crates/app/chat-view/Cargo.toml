[package]
name = "chat-view"
edition.workspace = true
version.workspace = true
publish = false

# A Rust-authored view, exported as a dynamically loaded wasm module by
# `export_view!`; `unsafe_code` is not forbidden only because the module
# exports need `#[unsafe(export_name)]`.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Builds chat's notifier alone (`notifier.rs`, `export_notifier!`) in place
# of the view: what a founding packs as the program's `ducktape.notify`
# section. Never on in the view's build.
notifier = []

[dependencies]
view.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
ducklink.workspace = true
chat = { path = "../chat" }
files.workspace = true
unicode-normalization.workspace = true
identity.workspace = true
access.workspace = true
harness.workspace = true
program.workspace = true
abi.workspace = true
# who can edit a room or a message: ownership's answers, in policy-view's words
ownership.workspace = true
policy-view.workspace = true
# code blocks, tables and headings drawn as forge-view draws them, with no parser
markdown.workspace = true
# widgets: a widget file's TOML, and any program's query and reply as JSON
# by the schema its code carries
toml.workspace = true
borsh.workspace = true
borsh-json.workspace = true
programs.workspace = true

[dev-dependencies]
criterion = "=0.8.2"
# `examples/live.rs` and the chain-backed tests: the fake node
view = { workspace = true, features = ["rig"] }

[[bench]]
name = "timeline"
harness = false
