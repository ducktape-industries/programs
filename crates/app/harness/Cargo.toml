[package]
name = "harness"
version.workspace = true
edition.workspace = true

# The types and rules are always built; a view links them with `program`
# off. `program` adds its wasm exports (`program::export!`), which only its
# own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = []
# `describe` makes this crate's wasm build the `ducktape.describe` module:
# the `describe` export alone, no program, no imports.
describe = []

[dependencies]
ownership = { workspace = true }
access = { workspace = true }
abi = { workspace = true }
design = { workspace = true }
borsh = { workspace = true }
describe = { workspace = true }
program = { workspace = true }
# `#[derive(program::Ask)]`: each query asked alone, typed by its reply
store = { workspace = true }
activity = { workspace = true }
attribution = { workspace = true }
identity = { workspace = true }
chat = { workspace = true }
ducklink = { workspace = true }
files = { workspace = true }
forge = { workspace = true }
# a wake's end is heard in the conversation whose turn armed it
wake = { workspace = true }
# `forge_commit` builds a commit's git objects and pack
gitcore = { workspace = true }
# network_query and network_call: JSON to a program's borsh and back
borsh-json = { workspace = true }
model-wire = { workspace = true }
# what a model is shown of an image: its bytes as base64
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
criterion = "=0.8.2"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
blobs = { workspace = true }
egress = { workspace = true }
halo = { workspace = true }
programs = { workspace = true }
awaits = { workspace = true }
scheduler = { workspace = true }
valset = { workspace = true }

[[bench]]
name = "decode"
harness = false
