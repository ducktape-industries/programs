[package]
name = "harness"
version.workspace = true
edition.workspace = true

# The types and rules are always built; a view links them with `program`
# off. `program` adds its wasm exports (`program::export!`), which only its
# own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = []
# `describe` makes this crate's wasm build the `ducktape.describe` module:
# the `describe` export alone, no program, no imports.
describe = []

[dependencies]
ownership = { path = "../../system/ownership" }
access = { path = "../../system/access" }
abi = { workspace = true }
design = { path = "../../sdk/design" }
borsh = { workspace = true }
describe = { path = "../../sdk/describe" }
program = { path = "../../sdk/program" }
# `#[derive(program::Ask)]`: each query asked alone, typed by its reply
store = { path = "../../sdk/store" }
activity = { path = "../activity" }
attribution = { path = "../attribution" }
identity = { path = "../../system/identity" }
chat = { path = "../chat" }
ducklink = { path = "../../sdk/ducklink" }
files = { path = "../files" }
forge = { path = "../forge" }
# a wake's end is heard in the conversation whose turn armed it
wake = { path = "../wake" }
# `forge_commit` builds a commit's git objects and pack
gitcore = { path = "../../lib/gitcore" }
# network_query and network_call: JSON to a program's borsh and back
borsh-json = { path = "../../lib/borsh-json" }
model-wire = { path = "../../lib/model-wire" }
# what a model is shown of an image: its bytes as base64
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
criterion = "=0.8.2"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }
blobs = { path = "../../system/blobs" }
egress = { path = "../egress" }
halo = { path = "../../system/halo" }
programs = { path = "../../system/programs" }
awaits = { path = "../../system/awaits" }
scheduler = { path = "../../system/scheduler" }
valset = { path = "../../system/valset" }

[[bench]]
name = "decode"
harness = false
