[package]
name = "actions-pods"
version.workspace = true
edition.workspace = true

# The types and rules are always built; a view links them with `program`
# off. `program` adds its wasm exports (`program::export_awaiting!`), which
# only its own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = []
# `describe` makes this crate's wasm build the `ducktape.describe` module:
# the `describe` export alone, no program, no imports.
describe = []

[dependencies]
abi = { workspace = true }
borsh = { workspace = true }
describe = { path = "../../sdk/describe" }
program = { path = "../../sdk/program" }
store = { path = "../../sdk/store" }
# the checks it claims and reports, and the requests egress keeps for it
actions = { path = "../actions" }
egress = { path = "../egress" }
serde_json = { workspace = true }
# who holds this program's name, which decides SetConcurrent
programs = { path = "../../system/programs" }

[dev-dependencies]
access = { path = "../../system/access" }
awaits = { path = "../../system/awaits" }
identity = { path = "../../system/identity" }
scheduler = { path = "../../system/scheduler" }
valset = { path = "../../system/valset" }
