[package]
name = "actions"
version.workspace = true
edition.workspace = true

# The types and rules are always built; a view links them with `program`
# off. `program` adds its wasm exports (`program::export!`), which only its
# own wasm build turns on.
[lib]
crate-type = ["cdylib", "rlib"]

[features]
program = []
# `describe` makes this crate's wasm build the `ducktape.describe` module:
# the `describe` export alone, no program, no imports.
describe = []

[dependencies]
abi = { workspace = true }
borsh = { workspace = true }
describe = { workspace = true }
program = { workspace = true }
store = { workspace = true }
# the events forge tells a watcher, and the workflow files read through it
forge = { workspace = true }
# where a push's red check is told
chat = { workspace = true }
# a check's log as a path on the reader's chain
ducklink = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
access = { workspace = true }
ownership = { workspace = true }
scheduler = { workspace = true }
gitcore = { workspace = true }
