[package]
name = "members-view"
edition.workspace = true
version.workspace = true
publish = false

# A Rust-authored view, exported as a dynamically loaded wasm module by
# `export_view!`; `unsafe_code` is not forbidden only because the module
# exports need `#[unsafe(export_name)]`.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
view = { path = "../../sdk/view" }
identity = { path = "../../system/identity" }
activity = { path = "../activity" }
valset = { path = "../../system/valset" }
programs = { path = "../../system/programs" }
serde.workspace = true
# `dm_channel_id`: the room Open DM opens
chat = { path = "../chat" }
# mints the `duck://<chain>/chat/<room>` link Open DM opens
ducklink = { path = "../../sdk/ducklink" }
# a card's picture, by its blob id
abi.workspace = true

# Typed fake-host tests use the program contracts.
[dev-dependencies]
# `examples/live.rs`: the view in the real app over the fake node
view = { path = "../../sdk/view", features = ["rig"] }
abi.workspace = true

[package.metadata.ducktape]
ships = true
rides = "identity"
