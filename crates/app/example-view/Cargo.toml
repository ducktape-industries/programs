[package]
name = "example-view"
edition.workspace = true
version.workspace = true
publish = false

# The wasm module the host loads.
[lib]
crate-type = ["cdylib"]

[dependencies]
view = { path = "../../sdk/view" }
# The program this view talks to: its types. Its `program` feature, the
# program's own wasm exports, stays off.
identity = { path = "../../system/identity" }
serde.workspace = true
