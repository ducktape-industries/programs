# Linux only by owner order; macOS runners are deliberately excluded.
name: ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 3

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup show
      # `make wasm-views` optimizes with Binaryen 132 exactly and reads the ABI with wasm-tools
      - run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_132/binaryen-version_132-x86_64-linux.tar.gz | tar xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/binaryen-version_132/bin" >> "$GITHUB_PATH"
          cargo install wasm-tools --locked
      - run: cargo fmt --all -- --check
      # the founding suite runs `make wasm-programs` itself
      - run: cargo test --locked --workspace --no-fail-fast
      - run: cargo clippy --locked --workspace --tests --no-deps -- -D warnings
      - run: make program-wasm-check CARGO="cargo --locked"
      - run: make view-wasm-check CARGO="cargo --locked"
      # the views fast (no wasm-opt) for the ABI; wasm-reproducible below builds, optimizes and gates the bytes that ship
      - run: make wasm-views CARGO="cargo --locked" WASM_PROFILE=fast
      # unlocked: the scaffold adds workspace members, so Cargo.lock changes
      - run: make scaffold-check
      - run: make wasm-reproducible CARGO="cargo --locked"
