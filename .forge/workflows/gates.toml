# The programs gates (AGENTS.md): rustfmt, clippy -D warnings with the feature sets crates
# build, and the workspace tests, run in one pod by gates.sh from the forge repo tools at its
# main head, cloned from the forge this repository's own clone came from (J-033, J-062).
name = "gates"

[on]
push = ["dev", "main"]
change = ["opened", "updated"]

# #engineering hears when a push's check ends failed or errored
[notify]
channel = "channel-18df9127f1a3eef4-1792310773949584"

[[jobs]]
id = "gates"
runs-on = ["pods"]
image = "localhost:5000/toolchain:f8ff9f00de3f@sha256:bbdcb20bbddd8035fd9a9fc0acf03330e0b4f5d00b05292bed7fd8279306b25c"
steps = [
    "git config --global --add safe.directory '*'",
    "git clone -q \"$(git remote get-url origin | sed 's#/forge/programs$#/forge/tools#')\" /var/tmp/tools",
    "sh /var/tmp/tools/gates.sh /work/programs",
]

[jobs.env]
FEATURE_SETS = "chat-view:notifier harness:program harness:describe"
TEST_ARGS = "--workspace"
