# core's build against this checkout: a change that touches a crate core links, or the core pin, checks core's
# dev with its programs pin patched to this checkout, so an SDK that no longer compiles against core's abi fails here,
# before it lands. tools' cross-pin.sh decides and runs it. memory stays unset until a run measures a core build's peak.
name = "cross-pin"

[on]
push = ["dev"]
change = ["opened", "updated"]

# #ci hears when a push's check ends failed or errored (orthory: not #engineering)
[notify]
channel = "ci"

[[jobs]]
id = "cross-pin"
runs-on = ["pods"]
# the same CPU ask as gates.toml; the target dir is memory-backed scratch, as there
cpu = "16"
scratch = ["/var/tmp/target"]
image = "localhost:5000/toolchain:d15b7b19a05e@sha256:c88bca22d224b57871f7cc6a0f1e35e93408c18ecee6e15fa7d044e81bef3b4b"
steps = [
    "git config --global --add safe.directory '*'",
    "git clone -q \"$(git remote get-url origin | sed 's#/forge/programs$#/forge/tools#')\" /var/tmp/tools",
    "sh /var/tmp/tools/cross-pin.sh /work/programs",
]
